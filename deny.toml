# cargo-deny config. Docs: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
# Fails on crates with a published RUSTSEC security advisory.
ignore = []

[licenses]
version = 2
# SPDX identifiers actually in use by our dependency tree today. Adding a new
# dependency with a license not listed here will fail CI — extend this list
# deliberately, don't just widen it to make an error go away.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
