name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets
      - run: cargo test --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  adr-lint:
    name: ADR lint
    runs-on: ubuntu-latest
    env:
      MDBOOK_LINT_VERSION: 0.16.1
      MDBOOK_LINT_SHA256: 51bacb1cc0af655d7e7073c0807ad7e3815fc39603c3626186bedc5726dfa0cb
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook-lint
        run: |
          curl -sSL -o mdbook-lint.tar.xz \
            "https://github.com/joshrotenberg/mdbook-lint/releases/download/v${MDBOOK_LINT_VERSION}/mdbook-lint-x86_64-unknown-linux-gnu.tar.xz"
          echo "${MDBOOK_LINT_SHA256}  mdbook-lint.tar.xz" | sha256sum -c -
          tar -xf mdbook-lint.tar.xz
          echo "$PWD/mdbook-lint-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: mdbook-lint lint adr/*.md
