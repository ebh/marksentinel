name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal repro, including relevant `docs/` content and command run.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: marksentinel version
      description: Output of `marksentinel --version`, or the commit if built from source.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
    validations:
      required: false
