  # MDBOOK* — mdBook-project structure rules (SUMMARY.md, chapters, includes).
  "MDBOOK001",
  "MDBOOK002",
  "MDBOOK003",
  "MDBOOK004",
  "MDBOOK005",
  "MDBOOK006",
  "MDBOOK007",
  "MDBOOK008",
  "MDBOOK009",
  "MDBOOK010",
  "MDBOOK011",
  "MDBOOK012",
  "MDBOOK016",
  "MDBOOK017",
  "MDBOOK021",
  "MDBOOK022",
  "MDBOOK023",
  "MDBOOK025",
]

# Every ADR here already auto-detects as MADR (YAML frontmatter with
# status/date), but pinning it explicitly documents that choice instead of
# relying on inference, and makes ADR004/015/017 (MADR-specific structure)
# apply unconditionally rather than only when detection guesses right.
[ADR]
format = "madr"
