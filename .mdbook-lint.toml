# mdbook-lint configuration for adr/*.md.
#
# These files are a MADR-format decision log, not mdBook chapters, so the
# generic standard-Markdown (MD*), CONTENT*, and MDBOOK* rules don't fit —
# e.g. CONTENT004 fights MADR's fixed Title Case section headings, and
# MD013's 80-column limit fights the ADRs' own wrapping style. Only the ADR*
# rules (required sections, status/date validity, numbering, internal links)
# should run.
#
# This is a denylist (every non-ADR rule as of mdbook-lint 0.16.1), not an
# `enabled-rules` allowlist, on purpose: an allowlist silently drops a future
# ADR018+ until someone adds it here, which is the failure we care about
# avoiding. A denylist inverts that risk — a future non-ADR rule turns on
# and adds noise until someone adds it below — which is the one we'd rather
# have. CI pins the mdbook-lint version (and its release SHA256) in ci.yml,
# so a version bump is already a deliberate, reviewed step; treat unexpected
# new warnings after a bump as this list needing an addition, not as a
# regression in the ADRs themselves.
disabled-rules = [
  # CONTENT* — prose/quality rules for mdBook chapters.
  "CONTENT001",
  "CONTENT002",
  "CONTENT003",
  "CONTENT004",
  "CONTENT005",
  "CONTENT006",
  "CONTENT007",
  "CONTENT009",
  "CONTENT010",
  "CONTENT011",

  # MD* — standard Markdown style rules (markdownlint-derived).
  "MD001",
  "MD002",
  "MD003",
  "MD004",
  "MD005",
  "MD006",
  "MD007",
  "MD009",
  "MD010",
  "MD011",
